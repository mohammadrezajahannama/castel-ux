<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تست اتصال حساب Castel</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<script src="../../shared/config.js"></script>
<script src="../../shared/ux-delivery.js"></script>
<script src="../../shared/submit-token.js"></script>
<script src="../../shared/ux-submit.js"></script>
<style>
/* VOICE: calm game UI for participants; precise research console for the admin.
   IDEA: a phone held up in a dark war room, a gold-lit console behind it.
   PICTURE: the live Castel mini-app screen, true to the Figma frames.
   COLOUR and TYPE: Castel dark surfaces, gold accent, orange caution, red only for irreversible; Vazirmatn.
   LAYOUT: phone + goal panel for the test; filters, tabs and figures for the admin. */
:root{color-scheme:dark;--bg:#0e0e0f;--s1:#1e1e1e;--s2:#171717;--s3:#2b2b2b;--s4:#343434;--b1:#232323;--b2:#2e2e2e;--b3:#3a3a3a;
--gold:#fad08c;--goldS:#4f422d;--goldW:#927f61;--t1:#fff;--t2:#d4d3d6;--t3:#aeaeae;--t4:#686868;--ok:#3aa750;--okS:#1f8d35;
--red:#e8313f;--redB:#df403d;--redS:#8d1f1f;--warn:#ff9533;--warnS:#4d2e14;--warnB:#ffb137;--silver:#7e7d7e}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--t1)}
body{font:15px/1.6 Vazirmatn,Tahoma,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
/* ---------- participant page ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
.panel{background:#151516;border:1px solid var(--b2);border-radius:16px;padding:28px}
.lead h1{font-size:30px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
.lead p{color:var(--t2);margin:0 0 12px;font-size:16px}
.goal{background:var(--goldS);border:1px solid var(--goldW);border-radius:12px;padding:16px 18px;margin:16px 0}
.goal b{color:var(--gold)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 28px;border:0;border-radius:8px;
background:linear-gradient(100deg,#b8966a,#fad08c 55%,#d8b47e);color:#000;font-weight:700;font-size:16px}
.cta:disabled{background:var(--s4);color:var(--t4);cursor:not-allowed}
.cta:focus-visible,.btn:focus-visible,.opt:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start}
.side{position:sticky;top:24px}
.side h2{font-size:20px;margin:0 0 8px}
.side .small{color:var(--t3);font-size:13px}
.phonebox{position:relative}
.phone{width:390px;height:848px;transform-origin:top right;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px #000c,0 0 0 8px #050505,0 0 0 9px #2a2a2a}
@media(max-width:600px){.panel{padding:20px}.lead h1{font-size:26px}}
@media(max-width:860px){.stage{grid-template-columns:1fr}.side{position:static}.phone{transform-origin:top center;border-radius:0;box-shadow:none}.phonebox{margin:0 -16px}}
/* ---------- the Castel screen ---------- */
.scr{position:relative;width:390px;height:848px;background:var(--s2);display:flex;flex-direction:column;overflow:hidden;
font-family:Vazirmatn,Tahoma,sans-serif;color:var(--t1);user-select:none;-webkit-tap-highlight-color:transparent}
.hdr{height:88px;flex:none;background:#1b2331}.hdr img{width:390px;height:88px;object-fit:cover;display:block}
.pt{flex:none;background:var(--s1);color:var(--gold);font-weight:700;font-size:14px;text-align:center;padding:12px 16px}
.bd{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.scr svg{width:20px;height:20px;flex:none}.cap svg,.chip svg,.pill svg{width:16px;height:16px}.bd.g12{gap:12px}.bd.g8{gap:8px}.bd::-webkit-scrollbar{display:none}
.ft{flex:none;padding:12px 16px 16px;border-top:1px solid var(--b2);display:flex;flex-direction:column;gap:8px;background:var(--s2)}
.h{font-size:16px;font-weight:700;line-height:24px;margin:0}
.p{font-size:12px;font-weight:500;line-height:20px;color:var(--t2);margin:0}
.lbl{font-size:12px;font-weight:700;line-height:20px;margin:0}
.cap{font-size:10px;line-height:18px;color:var(--t3)}
.col{display:flex;flex-direction:column;gap:8px}.col4{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:4px;border:0;font-weight:700;font-size:14px;padding:0 16px}
.sm .btn{height:40px}
.btn.gold{background:linear-gradient(100deg,#b8966a,#fad08c 55%,#d8b47e);color:#000}
.btn.red{background:linear-gradient(100deg,#8d1f1f,#c55959 55%,#9c2a2a);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--b3);color:var(--t2)}
.btn[aria-disabled=true]{background:var(--s4);color:var(--t4);cursor:not-allowed}
.btn svg{width:20px;height:20px}
.sbtn{border:0;border-radius:4px;padding:8px 16px;font-weight:700;font-size:12px;color:#000;background:linear-gradient(100deg,#b8966a,#fad08c 55%,#d8b47e)}
.card{background:var(--s1);border:1px solid var(--b2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px}
.card.sel{background:var(--goldS);border:2px solid var(--gold);padding:11px}
.card.keep{border:2px solid var(--ok);padding:11px}.card.rem{border:2px solid var(--redB);padding:11px}
.av{width:48px;height:48px;border-radius:4px;flex:none;object-fit:cover;border:1px solid #c9a46a55}
.nm{font-size:14px;font-weight:700;line-height:20px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:12px;background:var(--s3);font-size:10px;font-weight:600;color:var(--t2);white-space:nowrap}
.pill img{width:16px;height:16px;border-radius:50%}
.pill.ok{color:var(--t1)}.pill svg{width:12px;height:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
.tag svg{width:16px;height:16px}.tag.keep{background:var(--okS)}.tag.rem{background:var(--redS)}.tag.gold{background:var(--goldS)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stats.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--s3);border-radius:4px;padding:4px;text-align:center}
.stat i{display:block;font-style:normal;font-size:10px;color:var(--t3);line-height:18px}
.stat b{font-size:12px;font-weight:600;line-height:20px}
.delta{font-size:10px;font-weight:700;color:var(--ok);margin-inline-start:4px;display:inline-flex;align-items:center}
.delta svg{width:12px;height:12px}.same{font-size:10px;color:var(--t4);margin-inline-start:4px;font-weight:500}
.note{background:var(--s1);border:1px solid var(--b3);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.note .tt{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700}.note .tt svg{width:20px;height:20px;flex:none}
.note.danger{border-color:var(--redB)}.note.danger .tt{color:var(--red)}
.note.warn{border-color:var(--warnB)}.note.warn .tt{color:var(--gold)}
.note.orange{border-color:var(--warnB)}.note.orange .tt{color:var(--warn)}
.note.info .tt{color:var(--t1)}
.radio{width:24px;height:24px;border-radius:12px;border:2px solid var(--silver);flex:none;display:grid;place-items:center}
.radio.on{background:var(--gold);border:0}.radio svg{width:16px;height:16px}
.step{display:flex;gap:8px}.step>div{flex:1;text-align:center}.step i{display:block;height:4px;border-radius:2px;background:var(--s4);margin-bottom:8px}
.step .on i,.step .done i{background:var(--gold)}.step span{font-size:10px;color:var(--t4)}.step .done span{color:var(--t2)}.step .on span{color:var(--gold);font-weight:700}
.prog{display:flex;flex-direction:column;gap:12px}.prog b{color:var(--gold);font-size:12px}
.link{display:flex;align-items:center;gap:8px;background:var(--s3);border:1px solid var(--b3);border-radius:8px;padding:4px 12px 4px 4px}
.link code{flex:1;direction:ltr;text-align:left;font:500 12px/20px Vazirmatn,sans-serif;color:var(--t1)}
.link .cp{width:40px;height:40px;border:0;border-radius:4px;background:var(--s4);display:grid;place-items:center}
.link svg{width:20px;height:20px}
.timer{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:16px;background:var(--goldS);border:1px solid var(--goldW);color:var(--gold);font-size:12px;font-weight:700}
.timer svg{width:16px;height:16px}
.plat{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--b2);border-radius:8px;padding:12px}
.plat img{width:24px;height:24px;border-radius:50%}.plat .grow{font-size:14px;font-weight:600}
.num{width:20px;height:20px;border-radius:10px;background:var(--gold);color:#000;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:12px;background:var(--s3);font-size:10px;font-weight:600;white-space:nowrap}
.chip svg{width:12px;height:12px}
.ibox{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}.ibox svg{width:16px;height:16px}
.badge{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;flex:none}.badge svg{width:16px;height:16px}
.div{height:1px;background:var(--b2)}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--s1);border:1px solid var(--b2);border-radius:8px;padding:12px;font-size:12px;font-weight:500;color:var(--t2);text-align:right;width:100%}
.chk .box{width:20px;height:20px;border-radius:4px;border:2px solid var(--silver);flex:none;display:grid;place-items:center}
.chk.on{border-color:var(--goldW);color:var(--t1)}.chk.on .box{background:var(--gold);border:0}.chk svg{width:16px;height:16px}
.tile{flex:1;background:var(--s1);border:1px solid var(--b2);border-radius:8px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tile.sel{background:var(--goldS);border:2px solid var(--gold);padding:11px 7px}.tile.keep{border:2px solid var(--ok);padding:11px 7px}.tile.rem{border:2px solid var(--redB);padding:11px 7px}
.arrow{display:flex;justify-content:center}.arrow svg{width:24px;height:24px}
.dim{position:absolute;inset:0;background:#000b}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--s2);border:1px solid var(--b3);border-bottom:0;border-radius:16px 16px 0 0;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.handle{width:40px;height:4px;border-radius:2px;background:var(--s4);margin:0 auto}
.big{font-size:32px;font-weight:700;color:var(--gold);line-height:40px;text-align:center}
.hold{position:relative;overflow:hidden;height:40px;border-radius:4px;border:1px solid var(--gold);background:var(--goldS);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;width:100%;touch-action:none}
.hold .fill{position:absolute;inset:0 0 0 auto;width:0;background:#fad08c66}.hold span,.hold svg{position:relative}.hold svg{width:20px;height:20px}
.guide{margin:auto 0;border:2px dashed var(--goldW);border-radius:12px;padding:20px;background:#141414;display:flex;flex-direction:column;gap:12px}
.gtag{align-self:flex-start;background:var(--gold);color:#000;font-size:11px;font-weight:800;border-radius:4px;padding:2px 8px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#000e;border:1px solid var(--b3);border-radius:8px;padding:10px 12px;font-size:12px;text-align:center}
/* ---------- questionnaire ---------- */
.q{border-top:1px solid var(--b2);padding:20px 0}.q:first-of-type{border-top:0}
.q h3{font-size:17px;margin:0 0 12px;line-height:1.5}.q .hint{color:var(--t3);font-size:13px;margin:-6px 0 12px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--b3);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#1a1a1b;min-height:48px}
.opt input{accent-color:#fad08c;width:18px;height:18px;flex:none}.opt:has(input:checked){border-color:var(--gold);background:var(--goldS)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--b3);border-radius:10px;cursor:pointer;background:#1a1a1b;font-weight:700}
.scale label:has(input:checked){border-color:var(--gold);background:var(--goldS)}.scale input{position:absolute;opacity:0}
.scale-ends{display:flex;justify-content:space-between;color:var(--t3);font-size:13px;margin-top:6px}
textarea{width:100%;min-height:96px;background:#1a1a1b;border:1px solid var(--b3);border-radius:10px;color:var(--t1);font:16px/1.6 Vazirmatn,sans-serif;padding:12px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.codebox{direction:ltr;font:12px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;min-height:120px}
/* ---------- admin ---------- */
.adm{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
.adm h1{font-size:30px;margin:0;line-height:1.2}
.adm .sub{color:var(--t3);margin:4px 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--b3);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;min-height:40px;color:var(--t2);font-size:14px}
.seg button.on{background:var(--goldS);color:var(--gold);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--b2);margin:16px 0;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--t3);white-space:nowrap;font-size:15px}
.tabs button.on{color:var(--gold);border-color:var(--gold);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#151516;border:1px solid var(--b2);border-radius:12px;padding:14px}
.kpi i{font-style:normal;color:var(--t3);font-size:13px}.kpi b{display:block;font-size:28px;line-height:1.2;margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.sc{background:#151516;border:1px solid var(--b2);border-radius:12px;padding:16px}
.sc h3{margin:0 0 4px;font-size:18px}.sc .n{color:var(--t3);font-size:13px;margin-bottom:12px}
.sc.win{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.mrow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--b1);font-size:14px}
.mrow:first-of-type{border-top:0}.mrow span{color:var(--t2)}
.ok{color:var(--ok)}.bad{color:var(--red)}.mid{color:var(--warn)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:13px}
.btrack{height:22px;background:#1f1f20;border-radius:4px;overflow:hidden;position:relative}
.bfill{height:100%;border-radius:4px}.btrack span{position:absolute;inset:0 8px;display:flex;align-items:center;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qblock{background:#151516;border:1px solid var(--b2);border-radius:12px;padding:16px;margin-bottom:12px}
.qblock h3{margin:0 0 12px;font-size:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--t2);margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;border-bottom:1px solid var(--b2);text-align:right;vertical-align:top}
th{color:var(--t3);font-weight:500;font-size:13px}tbody tr{cursor:pointer}tbody tr:hover{background:#1a1a1b}
td.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.heat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:900px){.heat{grid-template-columns:1fr}}
.hbox{position:relative;width:390px;height:848px;transform-origin:top right}
.hbox .scr{pointer-events:none}.hbox canvas{position:absolute;inset:0;width:390px;height:848px;pointer-events:none}
.drawer{background:#151516;border:1px solid var(--b2);border-radius:12px;padding:16px;margin-top:12px}
.drawer h3{margin:0 0 8px}
.mini{font-size:13px;color:var(--t3)}
.abtn{background:#1f1f20;border:1px solid var(--b3);border-radius:8px;padding:8px 14px;min-height:40px;color:var(--t1);font-size:14px}
.abtn.gold{background:var(--goldS);border-color:var(--goldW);color:var(--gold)}.abtn.danger{border-color:var(--redB);color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--t3);border:1px dashed var(--b3);border-radius:12px}
.status{font-size:13px;color:var(--t3)}
</style>
</head>
<body>
<div id="app"></div>

  warning:'<path d="M12 3.5L2.5 20.5h19L12 3.5z"/><path d="M12 10v5"/><path d="M12 17.8v.2"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6v.2"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  merge:'<path d="M5 4v4a4 4 0 0 0 4 4h6a4 4 0 0 0 4-4V4"/><path d="M12 12v8"/><path d="M9 17l3 3 3-3"/>',
  noUndo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/><path d="M3 3l18 18"/>',
  arrowLeft:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  arrowDown:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  touch:'<path d="M10 13V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M13 11.5a1.5 1.5 0 0 1 3 0V13"/><path d="M16 12.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-4.3-2.5l-2.2-3.8a1.5 1.5 0 0 1 2.5-1.6L10 15"/><path d="M7.5 6.5a4 4 0 0 1 8 0"/>'
};
const ic = (n, c = 'currentColor', w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ---------- test data (simplified for people new to the game) ---------- */
const ACC = {
  tg:   {k:'tg',   name:'Tomas',   plat:'تلگرام', icon:A.tg,   av:A.avTomas,   castle:12, power:'۲.۱M', troops:'۱۸K',  vip:3, coins:9100,  age:'۸ ماه'},
  bale: {k:'bale', name:'Mohamad', plat:'بله',    icon:A.bale, av:A.avMohamad, castle:8,  power:'۹۸۰K', troops:'۶.۴K', vip:1, coins:10000, age:'۱۲ ماه'}
};
const other = k => k === 'tg' ? 'bale' : 'tg';
const SC_NAME = {a:'A · مرحله‌به‌مرحله', b:'B · پیش‌نمایش نتیجه', c:'C · تأیید آگاهانه'};
const SCREENS = [['s1','۱ · صفحهٔ حساب‌ها (بله)'],['s2','۲ · ساخت لینک (بله)'],['bridge','راهنمای رفتن به تلگرام'],['s3','۳ · باز شدن لینک'],['s4','۴ · انتخاب حساب'],['s5','۵ · تأیید نهایی']];

/* ---------- small building blocks ---------- */
const header = () => `<div class="hdr"><img src="${A.header}" alt=""></div>`;
const btn = (label, kind, act, o = {}) => `<button class="btn ${kind}" data-act="${act}"${o.dis ? ' aria-disabled="true"' : ''}>${o.icon ? ic(o.icon) : ''}<span>${label}</span></button>`;
const note = (kind, title, lines, icon) => {
  const col = {danger:'#e8313f', warn:'#fad08c', orange:'#ff9533', info:'#d4d3d6'}[kind];
  return `<div class="note ${kind}"><div class="tt">${ic(icon || (kind === 'info' ? 'info' : 'warning'), col)}<span>${title}</span></div>${lines.map(l => `<p class="p">${l}</p>`).join('')}</div>`;
};
const pl = a => `<span class="pill"><img src="${a.icon}" alt="">${a.plat}</span>`;
const tag = (k, t) => `<span class="tag ${k}">${ic(k === 'keep' ? 'checkCircle' : k === 'rem' ? 'trash' : 'user', '#fff')}${t}</span>`;
const identity = (a, extra = '', sub) => `<div class="row" style="gap:12px;align-items:flex-start"><img class="av" src="${a.av}" alt=""><div class="grow"><div class="nm">${a.name}</div><div class="cap">${sub || 'سطح قلعه ' + FA(a.castle) + ' · سرور ۴'}</div></div>${pl(a)}${extra}</div>`;
const stepper = cur => `<div class="prog"><b>مرحلهٔ ${FA(cur)} از ۳</b><div class="step">${['بررسی حساب‌ها','انتخاب حساب اصلی','تأیید نهایی'].map((l, i) => `<div class="${i + 1 < cur ? 'done' : i + 1 === cur ? 'on' : ''}"><i></i><span>${l}</span></div>`).join('')}</div></div>`;
const timer = cd => `<span class="timer">${ic('clock', '#fad08c')}<bdi dir="ltr" class="cd">${cd}</bdi> تا باطل شدن لینک</span>`;
const linkBox = () => `<div class="link">${ic('link', '#aeaeae')}<code>castel.link/c/8KX2-91QA</code><button class="cp" data-act="copy" aria-label="کپی">${ic('copy', '#fad08c')}</button></div>`;
const frame = (o) => `<div class="scr ${o.sm ? 'sm' : ''}" data-screen="${o.id}">${header()}${o.title ? `<div class="pt">${o.title}</div>` : ''}<div class="bd ${o.gap || ''}">${o.body}</div>${o.foot ? `<div class="ft">${o.foot}</div>` : ''}${o.over || ''}</div>`;

/* ---------- screens; ctx = {sc, sel, checks, cd} ---------- */
function s1Body() {
  const a = ACC.bale;
  return `<div class="card">${'<div class="row">' + tag('gold', 'حسابی که الان در آن هستید') + '</div>'}${identity(a)}</div>
  <div class="col"><p class="h">اتصال حساب در ۴ مرحله</p><p class="p">با اتصال، یک حساب بازی را هم در بله و هم در تلگرام باز می‌کنید. اگر در تلگرام هم حساب دارید، فقط یکی از دو حساب می‌ماند و دیگری حذف می‌شود.</p>
  ${['ساخت لینک (همین‌جا در بله)','باز کردن لینک (در تلگرام)','انتخاب حساب (در تلگرام)','تأیید نهایی (در تلگرام)'].map((t, i) => `<div class="row" style="gap:12px"><span class="num">${FA(i + 1)}</span><span class="p">${t}</span></div>`).join('')}</div>
  <div class="col"><p class="lbl">پیام‌رسان‌ها</p>
  <div class="plat"><img src="${A.bale}" alt=""><span class="grow">بله</span><span class="pill" style="background:none;color:#3aa750">${ic('checkCircle', '#3aa750')}همین حساب</span></div>
  <div class="plat"><img src="${A.tg}" alt=""><span class="grow">تلگرام</span><button class="sbtn" data-act="connect-tg">اتصال</button></div>
  <div class="plat"><img src="${A.eitaa}" alt="" style="border-radius:6px"><span class="grow">ایتا</span><button class="sbtn" data-act="connect-eitaa">اتصال</button></div></div>`;
}
const s1 = c => frame({id:'s1', title:'حساب‌ها', body:s1Body(), sm:c.sc !== 'a', foot:`<div class="row cap">${ic('lock', '#aeaeae')}<span>اتصال حساب برگشت ندارد. بعد از اتصال نمی‌توانید حساب‌ها را از هم جدا کنید.</span></div>`});

function s2(c) {
  if (c.sc === 'b') {
    return frame({id:'s2', title:'حساب‌ها', body:s1Body(), sm:true, over:`<div class="dim"></div><div class="sheet sm"><div class="handle"></div><p class="h">لینک اتصال به تلگرام</p>
    <p class="p">این لینک را در تلگرام، در «پیام‌های ذخیره‌شده» خودتان باز کنید. همان‌جا قبل از هر تغییری، نتیجهٔ اتصال را می‌بینید.</p>
    <div><div class="big"><bdi dir="ltr" class="cd">${c.cd}</bdi></div><div class="cap" style="text-align:center">تا باطل شدن لینک</div></div>${linkBox()}
    ${note('danger', 'این لینک مثل رمز حساب شماست', ['هر کس آن را باز کند می‌تواند حساب Mohamad را به تلگرام خودش وصل کند. برای کسی نفرستید.'])}
    ${btn('کپی لینک', 'gold', 'copy', {icon:'copy'})}${btn('بستن', 'ghost', 'back-s1')}</div>`});
  }
  return frame({id:'s2', title:'اتصال به تلگرام', sm:c.sc === 'c', body:`<div class="col"><p class="h">این لینک را در تلگرام باز کنید</p><p class="p">لینک را کپی کنید و در تلگرام، در «پیام‌های ذخیره‌شده» خودتان بازش کنید. دو تأیید بعدی همان‌جا انجام می‌شود.</p></div>
  <div class="col">${linkBox()}<div class="row">${timer(c.cd)}</div></div>
  ${note('danger', 'این لینک را برای کسی نفرستید', ['هر کس این لینک را باز کند می‌تواند حساب Mohamad را به حساب تلگرام خودش وصل کند. در بله دیگر از شما تأییدی گرفته نمی‌شود.'])}
  ${note('info', 'لینک فقط ۱۰ دقیقه کار می‌کند', ['اگر وقتش تمام شد، از همین صفحه یک لینک تازه بسازید.'])}`,
  foot:btn('کپی لینک', 'gold', 'copy', {icon:'copy'}) + btn('انصراف', 'ghost', 'back-s1')});
}
const bridge = c => frame({id:'bridge', title:'', body:`<div class="guide"><span class="gtag">راهنمای تست</span>
  <p class="h">لینک کپی شد ✓</p><p class="p" style="font-size:14px;line-height:24px">در بازی واقعی، حالا تلگرام را باز می‌کنی و لینک را در «پیام‌های ذخیره‌شده» خودت می‌زنی.<br>برای ادامهٔ تست، روی لینک زیر بزن.</p>
  <button class="link" data-act="open-link" style="width:100%;border:1px solid #927f61;cursor:pointer"><img src="${A.tg}" alt="" style="width:24px;height:24px;border-radius:50%"><code>castel.link/c/8KX2-91QA</code>${ic('arrowLeft', '#fad08c')}</button></div>`});

function s3(c) {
  const t = ACC.tg, m = ACC.bale;
  if (c.sc === 'b') {
    const tile = (a, lb, gold) => `<div class="tile"><span class="cap" style="font-weight:700;color:${gold ? '#fad08c' : '#aeaeae'}">${lb}</span><img class="av" src="${a.av}" alt=""><div class="nm">${a.name}</div><div class="cap">سطح قلعه ${FA(a.castle)} · قدرت ${a.power}</div>${pl(a)}</div>`;
    return frame({id:'s3', title:'اتصال حساب', sm:true, gap:'g12', body:`<p class="h">این لینک دو حساب را به هم وصل می‌کند</p>
    <div class="row" style="align-items:stretch">${tile(t, 'حسابی که الان در آن هستید', 1)}${tile(m, 'حسابی که لینک را ساخته')}</div>
    <div class="arrow">${ic('arrowDown', '#ff9533')}</div>
    <div class="note orange"><div class="tt">${ic('trash', '#ff9533')}<span>فقط یکی از این دو حساب می‌ماند</span></div><p class="p">حساب دیگر با قلعه، نیروها و منابعش حذف می‌شود. در مرحلهٔ بعد انتخاب می‌کنید.</p></div>`,
    foot:btn('انتخاب حسابی که می‌ماند', 'gold', 'to-s4', {icon:'arrowLeft'}) + btn('انصراف', 'ghost', 'cancel')});
  }
  return frame({id:'s3', title:'اتصال حساب', sm:c.sc === 'c', body:`${stepper(1)}<div class="col"><p class="h">دو حساب پیدا شد</p><p class="p">لینکی که باز کردید مال یک حساب در بله است. شما الان در تلگرام هستید و این‌جا هم حساب دارید.</p></div>
  <div class="col"><p class="lbl">حسابی که الان در آن هستید</p><div class="card">${identity(t)}</div></div>
  <div class="col"><p class="lbl">حسابی که لینک را ساخته</p><div class="card">${identity(m)}</div></div>`,
  foot:btn('ادامه', 'gold', 'to-s4', {icon:'arrowLeft'}) + btn('انصراف', 'ghost', 'cancel')});
}

function s4(c) {
  const sel = c.sel;
  if (c.sc === 'b') {
    const tile = a => {
      const st = !sel ? '' : sel === a.k ? 'sel' : '';
      const tg = !sel ? '' : sel === a.k ? tag('keep', 'می‌ماند') : tag('rem', 'حذف می‌شود');
      return `<div class="tile ${st}" data-act="pick-${a.k}" role="button" style="cursor:pointer"><img class="av" src="${a.av}" alt=""><div class="nm">${a.name}</div><div class="cap">سطح قلعه ${FA(a.castle)} · قدرت ${a.power}</div>${pl(a)}${tg}</div>`;
    };
    let res;
    if (sel) {
      const K = ACC[sel], R = ACC[other(sel)];
      const d = (v, delta) => `<b>${v}</b>${delta ? `<span class="delta">${ic('up', '#3aa750', 2.5)}${delta}</span>` : '<span class="same">بدون تغییر</span>'}`;
      const vipDelta = Math.max(K.vip, R.vip) - K.vip;
      res = `<div class="card" style="border:2px solid #fad08c;padding:11px;gap:8px"><div class="row">${tag('gold', 'حساب شما بعد از اتصال')}</div>
      <div class="row" style="gap:12px"><img class="av" src="${K.av}" alt=""><div class="grow"><div class="nm">${K.name}</div><div class="cap">سرور ۴</div></div><span class="pill"><img src="${A.tg}" alt="">تلگرام</span><span class="pill"><img src="${A.bale}" alt="">بله</span></div>
      <div class="stats c2"><div class="stat"><i>سطح VIP</i>${d(FA(Math.max(K.vip, R.vip)), vipDelta ? FA(vipDelta) : 0)}</div><div class="stat"><i>سکه</i>${d(nf(K.coins + R.coins), nf(R.coins))}</div>
      <div class="stat"><i>سطح قلعه</i>${d(FA(K.castle), 0)}</div><div class="stat"><i>قدرت</i>${d(K.power, 0)}</div></div></div>
      ${note('warn', 'از دست می‌رود', [`قلعه، ساختمان‌ها، نیروها و منابع ${R.name} (قدرت ${R.power})`])}`;
    } else {
      res = `<div class="card" style="border-style:dashed;align-items:center;text-align:center;padding:24px 12px"><span class="p">یک حساب را انتخاب کنید تا ببینید بعد از اتصال چه چیزی می‌ماند.</span></div>`;
    }
    return frame({id:'s4', title:'انتخاب حساب', sm:true, gap:'g8', body:`<p class="h">کدام حساب بماند؟</p><div class="row" style="align-items:stretch">${tile(ACC.tg)}${tile(ACC.bale)}</div><div class="arrow">${ic('arrowDown', '#fad08c')}</div>${res}`,
      foot:btn(sel ? 'ادامه با حساب ' + ACC[sel].name : 'یک حساب را انتخاب کنید', 'gold', 'to-s5', {icon:sel ? 'arrowLeft' : null, dis:!sel}) + btn('انصراف', 'ghost', 'cancel')});
  }
  const card = a => {
    const on = sel === a.k;
    return `<div class="card ${on ? 'sel' : ''}" data-act="pick-${a.k}" role="button" style="cursor:pointer">${identity(a, `<span class="radio ${on ? 'on' : ''}">${on ? ic('check', '#000', 2.5) : ''}</span>`, 'سرور ۴ · عمر حساب ' + a.age)}
    <div class="stats"><div class="stat"><i>سطح قلعه</i><b>${FA(a.castle)}</b></div><div class="stat"><i>قدرت</i><b>${a.power}</b></div><div class="stat"><i>نیروها</i><b>${a.troops}</b></div></div></div>`;
  };
  return frame({id:'s4', title:'انتخاب حساب', sm:c.sc === 'c', gap:'g12', body:`${stepper(2)}<div class="col4"><p class="h">پیشرفت کدام حساب بماند؟</p><p class="p">قلعه، نیروها و منابع حساب دیگر حذف می‌شود.</p></div>
  ${card(ACC.tg)}${card(ACC.bale)}
  <div class="note" style="border-color:#927f61"><div class="tt" style="color:#fad08c">${ic('merge', '#fad08c')}<span>این موارد در هر حالت در حسابی که انتخاب می‌کنید جمع می‌شوند</span></div>
  <div class="row" style="flex-wrap:wrap;gap:4px"><span class="chip">${ic('check', '#3aa750')}سطح VIP بالاتر: ۳</span><span class="chip">${ic('check', '#3aa750')}۱۹٬۱۰۰ سکه (جمع هر دو)</span></div></div>`,
  foot:btn(sel ? 'ادامه' : 'یک حساب را انتخاب کنید', 'gold', 'to-s5', {icon:sel ? 'arrowLeft' : null, dis:!sel}) + btn('انصراف', 'ghost', 'cancel')});
}

function s5(c) {
  const K = ACC[c.sel || 'tg'], R = ACC[other(c.sel || 'tg')];
  if (c.sc === 'b') {
    const item = (bg, icn, col, t, sub, tc, extra) => `<div class="row" style="gap:12px;align-items:flex-start;${extra || ''}"><span class="badge" style="background:${bg}">${ic(icn, col)}</span><div class="grow"><div class="lbl" style="color:${tc || '#fff'}">${t}</div><p class="p">${sub}</p></div></div>`;
    return frame({id:'s5', title:'تأیید نهایی', sm:true, body:`<div class="col4"><p class="h">قبل از اتصال، یک بار دیگر بخوانید</p><p class="p">با تأیید اتصال، این اتفاق‌ها می‌افتد:</p></div>
    <div class="card" style="padding:16px;gap:16px">${item('#1f8d35', 'checkCircle', '#fff', `حساب ${K.name} می‌ماند`, 'از این به بعد در تلگرام و بله باز می‌شود.')}<div class="div"></div>
    ${item('#4f422d', 'merge', '#fad08c', `این‌ها از ${R.name} به ${K.name} اضافه می‌شود`, 'سکه‌ها و سطح VIP بالاتر')}<div class="div"></div>
    ${item('#4d2e14', 'trash', '#ff9533', `حساب ${R.name} حذف می‌شود`, 'قلعه، ساختمان‌ها، نیروها و منابعش پاک می‌شود.', '#ff9533')}
    ${item('#8d1f1f', 'noUndo', '#fff', 'این کار برگشت ندارد', 'بعد از اتصال نمی‌توانید حساب‌ها را از هم جدا کنید.', '#e8313f', 'border:1px solid #df403d;border-radius:8px;padding:12px')}</div>`,
    foot:`<div class="hold" id="hold" role="button" tabindex="0"><div class="fill"></div>${ic('touch', '#fff')}<span>برای اتصال، دکمه را ۲ ثانیه نگه دارید</span></div>` + btn('انصراف', 'ghost', 'cancel')});
  }
  if (c.sc === 'c') {
    const all = c.checks.every(Boolean);
    const line = (bg, icn, col, t, tc) => `<div class="row" style="gap:12px"><span class="ibox" style="background:${bg}">${ic(icn, col)}</span><span class="p grow" style="color:${tc || '#fff'}">${t}</span></div>`;
    const chk = (i, t) => `<button class="chk ${c.checks[i] ? 'on' : ''}" data-act="chk-${i}"><span class="box">${c.checks[i] ? ic('check', '#000', 2.5) : ''}</span><span>${t}</span></button>`;
    return frame({id:'s5', title:'تأیید نهایی', sm:true, gap:'g12', body:`${stepper(3)}<p class="h">آخرین بررسی</p>
    <div class="card">${line('#1f8d35', 'checkCircle', '#fff', `حساب ${K.name} می‌ماند و در تلگرام و بله باز می‌شود.`)}<div class="div"></div>
    ${line('#4f422d', 'merge', '#fad08c', `سطح VIP بالاتر و سکه‌ها از ${R.name} به ${K.name} منتقل می‌شود.`)}<div class="div"></div>
    ${line('#4d2e14', 'trash', '#ff9533', `حساب ${R.name} با قلعه، نیروها و منابعش حذف می‌شود.`, '#ff9533')}</div>
    <p class="p">برای فعال شدن دکمه، هر سه مورد را تیک بزنید.</p>
    ${chk(0, 'می‌دانم این کار برگشت ندارد.')}${chk(1, 'می‌دانم بعد از اتصال نمی‌توانم حساب‌ها را از هم جدا کنم.')}${chk(2, `می‌دانم حساب ${R.name} دیگر برنمی‌گردد.`)}`,
    foot:btn('اتصال و حذف ' + R.name, 'red', 'confirm', {dis:!all}) + btn('انصراف', 'ghost', 'cancel')});
  }
  return frame({id:'s5', title:'تأیید نهایی', gap:'g12', body:`${stepper(3)}<p class="h">مطمئن هستید؟</p>
  <div class="card"><div class="row"><span class="p grow" style="color:#fff">حساب ${K.name} در تلگرام و بله باز می‌شود.</span>${tag('keep', 'می‌ماند')}</div><div class="div"></div>

/* ---------- encoding of result codes ---------- */
async function encode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let out = bytes, tagc = 'R';
  try { if (window.CompressionStream) { out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); tagc = 'Z'; } } catch (e) {}
  let s = ''; for (let i = 0; i < out.length; i += 8192) s += String.fromCharCode.apply(null, out.subarray(i, i + 8192));
  return 'CASTEL1' + tagc + ':' + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function decode(code) {
  const m = /^CASTEL1([RZ]):([A-Za-z0-9_-]+)$/.exec(code.trim()); if (!m) throw new Error('bad');
  const bin = atob(m[2].replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  let bytes = u; if (m[1] === 'Z') bytes = new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}

    ${rows.map(r => `<tr data-id="${esc(r.id)}"><td class="n">${new Date(r.startedAt).toLocaleString('fa-IR', {dateStyle:'short', timeStyle:'short'})}</td><td><b style="color:${COL[r.scenario]}">${r.scenario.toUpperCase()}</b></td><td>${r.device === 'desktop' ? 'دسکتاپ' : 'موبایل'}</td>
    <td>${oc[r.outcome] || r.outcome}${r.finished ? '' : ' · بی‌جواب'}</td><td>${r.choice ? ACC[r.choice].name + (r.choiceCorrect ? ' <span class="ok">✓</span>' : ' <span class="bad">✗</span>') : '—'}</td>
    <td class="n">${r.score ? FA(r.score.comp) + '/۴' : '—'}</td><td class="n">${r.answers ? FA(r.answers.q5) : '—'}</td><td class="n">${r.answers ? FA(r.answers.q6) : '—'}</td>
    <td class="n">${FA(Math.round(Object.values(r.times || {}).reduce((a, b) => a + b, 0) / 1000))} ث</td></tr>`).join('')}</tbody></table></div><div id="det"></div>`;
    v.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => { sel = tr.dataset.id; detail(rows.find(r => r.id === sel)); });
    if (sel) detail(rows.find(r => r.id === sel));
    document.getElementById('csv').onclick = async () => {
      const head = ['id', 'scenario', 'device', 'outcome', 'endScreen', 'choice', 'choiceCorrect', 'q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'comp', 'cancels', 'backs', 'restarts', 'holdAttempts', 'seconds', 'q7'];
      const line = r => [r.id, r.scenario, r.device, r.outcome, r.endScreen, r.choice, r.choiceCorrect, ...(r.answers ? [r.answers.q1, r.answers.q2, r.answers.q3, r.answers.q4, r.answers.q5, r.answers.q6] : ['', '', '', '', '', '']), r.score ? r.score.comp : '', r.cancels, r.backs, r.restarts, r.holdAttempts, Math.round(Object.values(r.times || {}).reduce((a, b) => a + b, 0) / 1000), r.answers ? r.answers.q7 : ''].map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',');
      const csv = [head.join(','), ...rows.map(line)].join('\n');
      try { await navigator.clipboard.writeText(csv); document.getElementById('csvm').textContent = 'کپی شد؛ در Sheets یا Excel بچسبان.'; } catch (e) { document.getElementById('csvm').textContent = 'مرورگر اجازهٔ کپی نداد.'; }
    };
  }
  function detail(r) {
    const d = document.getElementById('det'); if (!r || !d) return;
    const qa = r.answers ? [['س۱', r.answers.q1, r.score.q1], ['س۲', r.answers.q2, r.score.q2], ['س۳', r.answers.q3, r.score.q3], ['س۴', r.answers.q4, r.score.q4]] : [];
    d.innerHTML = `<div class="drawer"><h3>جلسهٔ ${esc(r.id)} · ${SC_NAME[r.scenario]}</h3>
    <p class="mini">${r.assigned === 'link' ? 'سناریو از لینک' : 'سناریو تصادفی'} · عرض صفحه ${FA(r.vw)} · صفحه‌های دیده‌شده: ${(r.reached || []).join('، ')}</p>
    ${qa.length ? `<div class="kpis">${qa.map(([t, a, ok]) => `<div class="kpi"><i>${t}</i><b class="${ok ? 'ok' : 'bad'}" style="font-size:18px">${esc(ANS[a] || a)}</b></div>`).join('')}<div class="kpi"><i>اطمینان / سختی</i><b style="font-size:18px">${FA(r.answers.q5)} / ${FA(r.answers.q6)}</b></div></div>
    ${r.answers.q7 ? `<p style="margin-top:12px">«${esc(r.answers.q7)}»</p>` : ''}` : '<p class="mini">این نفر به سؤال‌ها نرسید.</p>'}
    <h3 style="margin-top:16px;font-size:15px">زمان روی هر صفحه</h3><p class="mini">${Object.entries(r.times || {}).map(([k, t]) => `${k}: ${FA((t / 1000).toFixed(1))}ث`).join(' · ')}</p>
    <h3 style="margin-top:12px;font-size:15px">ترتیب کلیک‌ها</h3><p class="mini">${(r.clicks || []).filter(c => c.a).map(c => `${c.s}→${esc(actName(c.a))}`).join(' · ') || '—'}</p>
    <button class="abtn danger" id="del" style="margin-top:12px">حذف این جلسه</button> <span id="delm" class="status"></span></div>`;
    let armed = false;
    document.getElementById('del').onclick = async e => {
      if (!armed) { armed = true; e.target.textContent = 'برای حذف دوباره بزن (برگشت ندارد)'; return; }
      try { if (r.__path) await DB.doc(r.__path).delete(); local = local.filter(x => x.id !== r.id); ALL = ALL.filter(x => x.id !== r.id); sel = null; draw(); }
      catch (err) { document.getElementById('delm').textContent = 'فقط جلسه‌هایی که خودت با کد اضافه کرده‌ای حذف می‌شوند.'; }
    };
  }
  function imp(v) {
    v.innerHTML = `<div class="qblock"><h3>لینک‌هایی که برای شرکت‌کننده‌ها می‌فرستی</h3>
    <p class="mini">آدرس همین صفحه را بدون #admin بفرست تا سناریو تصادفی انتخاب شود. برای کنترل تعداد هر گروه، این‌ها را به آخر آدرس اضافه کن:</p>
    <div class="mrow"><span>فقط سناریو A</span><b style="direction:ltr">#scenario-a</b></div><div class="mrow"><span>فقط سناریو B</span><b style="direction:ltr">#scenario-b</b></div><div class="mrow"><span>فقط سناریو C</span><b style="direction:ltr">#scenario-c</b></div>
    <p class="mini">شرکت‌کننده‌هایی که وارد Claude نشده‌اند یا اجازهٔ نوشتن ندارند، در پایان یک «کد نتیجه» می‌گیرند. آن کد را این‌جا بچسبان.</p></div>
    <div class="qblock"><h3>افزودن کد نتیجه</h3><p class="mini">می‌توانی چند کد را با هم بچسبانی (هر کد در یک خط).</p>
    <textarea id="codes" class="codebox" placeholder="CASTEL1Z:..."></textarea><div class="bar"><button class="abtn gold" id="add">افزودن</button><span id="addm" class="status">${impMsg}</span></div></div>`;
    document.getElementById('add').onclick = async () => {
      const codes = document.getElementById('codes').value.split(/\s+/).filter(Boolean); let ok = 0, bad = 0, dup = 0;
      for (const c of codes) {
        try { const r = await decode(c); if (!r || !r.id || !SC.includes(r.scenario)) throw 0;
          if ([...ALL, ...local].some(x => x.id === r.id)) { dup++; continue; }
          r.importedAt = Date.now(); local.push(r);
          try { await saveImported(r); } catch (e) {}
          ok++; } catch (e) { bad++; }
      }
      impMsg = `${FA(ok)} کد اضافه شد${dup ? ' · ' + FA(dup) + ' تکراری' : ''}${bad ? ' · ' + FA(bad) + ' کد نامعتبر' : ''}.`;
      if (ok) await load(); else draw();
    };
  }
  return {start};
})();

boot();
}
</script>
</body>
</html>
